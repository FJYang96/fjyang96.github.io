<header class="site-header" id="top">
  <div class="site-frame header-inner">
    <a class="site-identity" href="{{ '/' | relative_url }}">Fengjun's Homepage</a>
    {% if page.url == '/' %}
      <div class="content-tabs header-tabs" role="tablist" aria-label="Homepage sections">
        <button id="notes-tab" type="button" role="tab" aria-selected="false" aria-controls="notes-panel" tabindex="-1">Notes <span class="tab-count">{{ site.posts | size }}</span></button>
        <button id="about-tab" type="button" role="tab" aria-selected="true" aria-controls="about-panel">About</button>
      </div>
    {% endif %}
  </div>
</header>
