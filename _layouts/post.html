---
layout: default
---
<article class="article-shell">
  <header class="article-header">
    <a class="article-back" href="{{ '/#writing' | relative_url }}">← Writing</a>
    <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="article-deck">{{ page.description }}</p>{% endif %}
    {% if page.tags %}
      <ul class="tag-list" aria-label="Topics">
        {% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}
      </ul>
    {% endif %}
  </header>
  <div class="article-content">
    {{ content }}
  </div>
</article>
